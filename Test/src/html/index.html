<!DOCTYPE html>
<html lang="en">
<head> <!-- En-tête de la page -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="titre">Controlleur Exodus</title>
</head>
<body> <!-- Corps de la page -->
    <div id="status">
    <h1>Controlleur Exodus</h1> <!-- Titre de la page -->
    <div class="controlleur">
    <div class="boutonsControlleur"> <!--Boite de contrôle pour le bras gauche-->
        <h1>Bras Gauche</h1>
    <button class="Allumer ButDebuter" href="/on">Allumer</button>
    <button class="Eteindre ButDebuter" href="/off">Eteindre</button>
    </div>
    <div class="boutonsControlleur"> <!--Boite de contrôle pour le bras droit-->
        <h1>Bras Droit</h1>
    <button class="Allumer ButDebuter" href="/on">Allumer</button>
    <button class="Eteindre ButDebuter" href="/off">Eteindre</button>
    </div>
    </div>
</div>
</body>
</html>
<script>
document.getElementsByClassName("Allumer")[0].onclick = function() { // envoie sur la page /on ce qui allume la LED
    window.location.href = this.getAttribute("href");
};
document.getElementsByClassName("Eteindre")[0].onclick = function() { // envoie sur la page /off ce qui éteint la LED
    window.location.href = this.getAttribute("href");
};
</script>


<style> /* Style de la page */

.controlleur{
    display: flex;
    flex-direction: row;
    justify-content: center;
    gap : 50px;
}

#status {
    color: rgb(240, 232, 232);
    margin: auto;
    width: 50%;
    margin-top: 100px;
    padding: 20px;
    background-color: rgb(77, 77, 90);
    border-radius: 15px;
    text-align: center;
}

.boutonsControlleur {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.ButDebuter {
    color: rgb(240, 232, 232);
    border: none;
    border-radius: 10px;
    padding: 10px 24px;
    width: 100%;
    display: flex;
    justify-content: center;
    cursor: pointer;
    font-weight: bold;
}
.ButDebuter:hover {
    box-shadow:8px 8px 8px 0 rgba(16, 16, 16, 0.4);
}

.Allumer {
    background-color: rgb(89, 205, 89);
}
.Eteindre {
    background-color: rgb(205, 89, 89);
}
</style>
