<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controlleur Exodus</title>
</head>
<body>
    <div id="status">
    <h1>La LED est eteinte</h1>
    <div class="boutonsControlleur">
    <button class="Allumer ButDebuter" href="/on">Allumer</button>
    </div>
</div>
</body>
</html>
<script>
document.getElementsByClassName("Allumer")[0].onclick = function() {
    window.location.href = this.getAttribute("href");
};
</script>
<style>
#status {
    color: rgb(240, 232, 232);
    margin: auto;
    width: 50%;
    margin-top: 100px;
    padding: 20px;
    background-color: rgb(77, 77, 90);
    border-radius: 15px;
    text-align: center;
}

.boutonsControlleur {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.ButDebuter {
    color: rgb(240, 232, 232);
    border: none;
    border-radius: 10px;
    padding: 10px 24px;
    width: 100%;
    display: flex;
    justify-content: center;
    cursor: pointer;
    font-weight: bold;
}
.ButDebuter:hover {
    box-shadow:8px 8px 8px 0 rgba(16, 16, 16, 0.4);
}
.Allumer {
    background-color: rgb(89, 205, 89);
}
</style>
